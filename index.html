<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Mother's Day</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cyber-green': '#00ffaa',
                        'cyber-blue': '#00aaff',
                        'cyber-pink': '#ff1493',
                        'cyber-dark': '#010203'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;500;700&family=Zhi+Mang+Xing&display=swap');

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #010203; font-family: 'Noto Sans SC', sans-serif; color: white; touch-action: none; -webkit-user-select: none; user-select: none; }
        .allow-select { -webkit-user-select: text !important; user-select: text !important; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .glass-panel { background: rgba(3, 5, 8, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(0, 255, 170, 0.2); border-radius: 12px; box-shadow: 0 8px 32px rgba(0, 255, 170, 0.1); }
        .cyber-button { background: rgba(255, 105, 180, 0.1); border: 1px solid #ff1493; color: #ff69b4; transition: all 0.3s ease; box-shadow: 0 0 10px rgba(255, 105, 180, 0.15); }
        .cyber-button:hover { background: rgba(255, 105, 180, 0.3); box-shadow: 0 0 20px rgba(255, 105, 180, 0.4); color: #fff; }
        #loading-screen { position: absolute; z-index: 50; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #010203; transition: opacity 1s ease-out; overflow-y: auto; padding: 20px; }
        .loader-ring { width: 80px; height: 80px; border: 3px solid transparent; border-top-color: #ff69b4; border-bottom-color: #ff1493; border-radius: 50%; animation: spin 1.5s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #pip-container { width: 120px; height: 90px; position: absolute; bottom: 20px; right: 20px; z-index: 20; border-radius: 8px; border: 2px solid rgba(255, 105, 180, 0.4); overflow: hidden; box-shadow: 0 0 15px rgba(255, 105, 180, 0.2); }
        #webcam-video, #output-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; z-index: 10; pointer-events: none; transition: all 0.2s ease; }
        #crosshair.active { border-color: #ff1493; transform: translate(-50%, -50%) scale(1.5); background: rgba(255, 105, 180, 0.2); }
        #gesture-state { position: absolute; bottom: 20px; left: 20px; z-index: 20; pointer-events: none; transition: opacity 0.5s ease; }
        #top-controls { position: absolute; top: 20px; right: 20px; z-index: 30; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; opacity: 0; pointer-events: auto; transition: opacity 0.5s ease; max-width: 85%; }
        .control-btn { background: rgba(3, 5, 8, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 105, 180, 0.3); border-radius: 50px; padding: 8px 14px; color: #ff69b4; font-size: 13px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 6px; font-family: 'Noto Sans SC', sans-serif; font-weight: bold; -webkit-tap-highlight-color: transparent; }
        .control-btn:hover, .control-btn:active { background: rgba(255, 105, 180, 0.2); color: white; box-shadow: 0 4px 12px rgba(255, 105, 180, 0.3); transform: translateY(-2px); }
        #gift-btn { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); z-index: 40; cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: all 0.3s ease; opacity: 0; pointer-events: none; }
        #gift-btn:hover { transform: translateY(-50%) scale(1.1); }
        .gift-icon { font-size: 44px; filter: drop-shadow(0 4px 6px rgba(255, 105, 180, 0.5)); animation: bounce 2s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        #gift-modal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
        #gift-modal.show { opacity: 1; pointer-events: auto; }
        #gift-modal-bg { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); }
        #gift-modal-content { position: relative; width: 90%; max-width: 380px; background-color: #fff; background-image: url('https://images.unsplash.com/photo-1558244402-286dd748c593?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80'); background-size: cover; background-position: center; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(255, 105, 180, 0.3); transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin: auto; }
        #gift-modal.show #gift-modal-content { transform: scale(1); }
        .card-inner-overlay { background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.95) 100%); padding: 40px 24px; display: flex; flex-direction: column; align-items: center; height: 100%; }
        .calligraphy-text { font-family: 'Zhi Mang Xing', cursive; font-size: 52px; color: #1a1a1a; line-height: 1.1; margin-bottom: 5px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .english-script { font-family: 'Dancing Script', cursive; font-size: 24px; color: #4a4a4a; margin-bottom: 30px; }
        .poem-text { font-family: 'Noto Sans SC', sans-serif; color: #555; font-size: 14px; line-height: 2; text-align: right; width: 100%; padding-right: 10px; margin-bottom: 40px; font-weight: 500; letter-spacing: 2px; }
        #big-card-modal { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); }
        #big-card-modal.show { opacity: 1; pointer-events: auto; }
        #big-card-content { position: relative; width: 90%; max-width: 600px; height: 75vh; background: #111; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(255, 105, 180, 0.4); transform: translateY(30px); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #big-card-modal.show #big-card-content { transform: translateY(0); }
        #big-card-img-preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.45; z-index: 0; }
        #big-card-text-display { position: relative; z-index: 10; flex: 1; padding: 40px 30px; font-size: 20px; color: #ffffff; line-height: 2.0; text-align: left; font-family: 'Noto Sans SC', sans-serif; text-shadow: 0 4px 12px rgba(0,0,0,0.9), 0 1px 3px rgba(0,0,0,0.8); overflow-y: auto; display: block; white-space: pre-wrap; word-break: break-word; }
        #close-big-card { position: relative; z-index: 10; margin-top: auto; }
        #ai-caption-box { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; z-index: 30; text-align: center; pointer-events: auto; transition: opacity 0.5s ease, transform 0.5s ease; box-shadow: 0 0 20px rgba(255, 105, 180, 0.2); }
        #ai-caption-box.hidden-box { opacity: 0; pointer-events: none; transform: translate(-50%, 20px); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 105, 180, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 105, 180, 0.8); }
    </style>
</head>
<body>

    <div id="crosshair" class="hidden md:block"></div>
    <div id="gift-btn">
        <div class="gift-icon">🎁</div>

    <div id="edit-card-modal" class="fixed inset-0 z-[80] hidden flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" id="edit-card-bg"></div>
        <div class="relative w-[90%] max-w-md bg-[#111] border border-pink-500/50 rounded-2xl p-6 shadow-[0_0_30px_rgba(255,105,180,0.3)] transform scale-95 transition-transform duration-300 flex flex-col" id="edit-card-content">
            <h3 class="text-pink-400 text-lg font-bold mb-4 border-b border-pink-500/30 pb-2">重新编辑大贺卡</h3>
            <label class="w-full block bg-black/60 border border-dashed border-pink-500/50 rounded-lg p-4 text-center cursor-pointer hover:bg-black/80 transition mb-4">

    <div id="photo-manager-modal" class="fixed inset-0 z-[80] hidden flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" id="photo-manager-bg"></div>
        <div class="relative w-[90%] max-w-2xl max-h-[85vh] bg-[#111] border border-pink-500/50 rounded-2xl p-6 shadow-[0_0_30px_rgba(255,105,180,0.3)] transform scale-95 transition-transform duration-300 flex flex-col" id="photo-manager-content">
            <div class="flex justify-between items-center mb-4 border-b border-pink-500/30 pb-2">
                <h3 class="text-pink-400 text-lg font-bold">照片相册管理</h3>
                <button id="btn-close-photo-manager" class="text-gray-400 hover:text-white text-3xl font-bold leading-none">&times;</button>
            </div>
            <label class="w-full bg-pink-500/10 border border-dashed border-pink-500/50 rounded-lg p-3 text-center cursor-pointer hover:bg-pink-500/30 transition mb-4 block">
                <span class="text-pink-200 font-bold tracking-widest">➕ 点击上传添加新照片</span>
                <input type="file" id="manager-add-photos" accept="image/*" multiple class="hidden">
            </label>
            <div id="photo-grid" class="flex-1 overflow-y-auto grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 p-1 content-start"></div>
            <p class="text-xs text-gray-500 mt-4 text-center">💡 提示：照片的添加和删除会在关闭此面板后自动刷新并生效。</p>
        </div>

    <div id="ai-caption-box" class="glass-panel px-6 py-4 hidden-box flex items-center justify-center gap-3">
        <p id="ai-caption-text" class="text-white text-sm md:text-base font-bold tracking-wide">✨ AI 正在凝视回忆...</p>
    </div>
    
    <!-- 加载页 -->
    <div id="loading-screen">
        <div class="loader-ring mb-8" id="loader-anim"></div>
        <h1 class="text-3xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyber-green to-cyber-blue tracking-widest mb-2 font-[Orbitron]">CAKE VISION</h1>
        <p id="loading-text" class="text-gray-400 text-sm mb-8 tracking-widest font-bold">正在加载引擎与模型...</p>
        <div id="action-container" class="hidden flex flex-col items-center gap-4 w-full max-w-md px-4 pb-10">
            <div class="w-full bg-white/5 border border-pink-500/30 rounded-xl p-4 shadow-inner">
                <h3 class="text-pink-400 text-sm font-bold mb-3 border-b border-pink-500/20 pb-2">📂 基础媒体设置</h3>
                <div class="flex gap-4 w-full">
                    <label class="cyber-button w-1/2 py-2 rounded-xl cursor-pointer text-center font-bold flex flex-col justify-center items-center gap-1"><span class="text-xl">📸</span><span id="upload-text" class="text-[10px]">[ 缓存: 0 张 ]</span><input type="file" id="upload-photos-start" accept="image/*" multiple class="hidden"></label>
                    <label class="cyber-button w-1/2 py-2 rounded-xl cursor-pointer text-center font-bold flex flex-col justify-center items-center gap-1 border-cyber-blue text-cyber-blue shadow-[0_0_10px_rgba(0,170,255,0.2)]"><span class="text-xl">🎵</span><span id="music-text" class="text-[10px]">[ 默认音乐 ]</span><input type="file" id="upload-music-start" accept="audio/*" class="hidden"></label>
                </div>
            </div>
            <div class="w-full bg-white/5 border border-pink-500/30 rounded-xl p-4 shadow-inner mt-2">
                <h3 class="text-pink-400 text-sm font-bold mb-3 border-b border-pink-500/20 pb-2">💌 专属大贺卡编辑</h3>
                <label class="w-full block bg-black/40 border border-dashed border-pink-500/50 rounded-lg p-3 text-center cursor-pointer hover:bg-black/60 transition mb-3"><span class="text-pink-300 text-sm font-medium" id="card-img-status">上传贺卡背景 (选填)</span><input type="file" id="upload-card-img" accept="image/*" class="hidden"></label>
                <textarea id="card-text-input" rows="3" class="allow-select w-full bg-black/40 border border-pink-500/30 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-pink-500 transition resize-none placeholder-gray-500" placeholder="节日快乐，妈妈！(选填)"></textarea>
            </div>
            <button id="btn-start" class="cyber-button w-full py-4 rounded-full font-bold text-lg text-white bg-white/10 hover:bg-white/20 mt-2 transition transform hover:scale-[1.02]">▶ 开启礼物视界</button>
        </div>

    <div id="canvas-container"></div>
    <div id="gesture-state" class="glass-panel px-4 py-2 hidden opacity-0">
        <div class="text-sm text-cyber-green font-bold" id="mode-text">等待手势...</div>
        <div class="text-xs text-gray-400 mt-1" id="hint-text">🌬️ 吹风、手势控制或双击屏幕</div>
    </div>
    <div id="pip-container" class="hidden opacity-0" style="transition: opacity 0.5s ease;"><video id="webcam-video" autoplay playsinline muted></video><canvas id="output-canvas"></canvas></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/", "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm" } }</script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { HandLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';
        import * as TWEEN from 'https://cdnjs.cloudflare.com/ajax/libs/tween.js/21.0.0/tween.esm.js';

        const GeminiAPI = {
            key: "", 
            callVision: async (prompt, base64Image) => {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${GeminiAPI.key}`;
                let parts = [{ text: prompt }];
                if (base64Image) {
                    try {
                        const mimeType = base64Image.match(/data:(.*?);base64/)[1];
                        const data = base64Image.split(',')[1];
                        parts.push({ inlineData: { mimeType, data } });
                    } catch(e) {}
                }
                const payload = { contents: [{ role: "user", parts }] };
                for (let i = 0; i <= 2; i++) {
                    try {
                        const response = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const result = await response.json();
                        return result.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    } catch (error) {
                        if (i === 2) return null;
                        await new Promise(res => setTimeout(res, 1000 * (i+1)));
                    }
                }
            }
        };

        const DB = {
            db: null,
            init: () => new Promise((resolve, reject) => {
                try {
                    if (!window.indexedDB) { resolve(); return; }
                    const req = indexedDB.open("MotherDayDB", 3);
                    req.onupgradeneeded = e => {
                        const db = e.target.result;
                        if(!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
                        if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'id' });
                    };
                    req.onsuccess = e => { DB.db = e.target.result; resolve(); };
                    req.onerror = e => resolve(); 
                } catch(e) { resolve(); }
            }),
            addPhoto: (dataUrl) => new Promise(resolve => {
                if(!DB.db) return resolve(null);
                try {
                    const tx = DB.db.transaction('photos', 'readwrite');
                    const req = tx.objectStore('photos').add({ data: dataUrl });
                    req.onsuccess = e => resolve(e.target.result);
                    req.onerror = e => resolve(null);
                } catch(e) { resolve(null); }
            }),
            getAllPhotosDetailed: () => new Promise(resolve => {
                if(!DB.db) return resolve([]);
                try {
                    const tx = DB.db.transaction('photos', 'readonly');
                    const photos = [];
                    const req = tx.objectStore('photos').openCursor();
                    req.onsuccess = e => {
                        const cursor = e.target.result;
                        if(cursor) { photos.push({ id: cursor.key, data: cursor.value.data }); cursor.continue(); } 
                        else resolve(photos);
                    };
                    req.onerror = () => resolve([]);
                } catch(e) { resolve([]); }
            }),
            getPhotos: () => new Promise(resolve => {
                if(!DB.db) return resolve([]);
                try {
                    const tx = DB.db.transaction('photos', 'readonly');
                    const req = tx.objectStore('photos').getAll();
                    req.onsuccess = e => resolve(e.target.result.map(r => r.data));
                    req.onerror = () => resolve([]);
                } catch(e) { resolve([]); }
            }),
            deletePhoto: (id) => new Promise(resolve => {
                if(!DB.db) return resolve();
                try {
                    const tx = DB.db.transaction('photos', 'readwrite');
                    tx.objectStore('photos').delete(Number(id));
                    tx.oncomplete = resolve;
                } catch(e) { resolve(); }
            }),
            saveSetting: (id, data) => new Promise(resolve => {
                if(!DB.db) return resolve();
                try {
                    const tx = DB.db.transaction('settings', 'readwrite');
                    tx.objectStore('settings').put({ id, data });
                    tx.oncomplete = resolve;
                } catch(e) { resolve(); }
            }),
            getSetting: (id) => new Promise(resolve => {
                if(!DB.db) return resolve(null);
                try {
                    const tx = DB.db.transaction('settings', 'readonly');
                    const req = tx.objectStore('settings').get(id);
                    req.onsuccess = e => resolve(e.target.result ? e.target.result.data : null);
                    req.onerror = () => resolve(null);
                } catch(e) { resolve(null); }
            })
        };

        const compressImage = (file) => new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 1200;
                    let w = img.width, h = img.height;
                    if(w > h && w > MAX_SIZE) { h *= MAX_SIZE/w; w = MAX_SIZE; }
                    else if(h > MAX_SIZE) { w *= MAX_SIZE/h; h = MAX_SIZE; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');

            try { if (!AudioSys.isPlaying) { await AudioSys.toggle(); DOM.btnMusic.innerText = "🔊 音乐: 开"; DOM.btnMusic.classList.add('active'); } } catch(e){}
            for(let txt of ["5", "4", "3", "2", "1"]) { if(State.sequenceId !== currentSeq) return; ParticleSystem.morphTo(txt, 800); await new Promise(r => setTimeout(r, 1000)); }
            for(let i=0; i<State.customPhrases.length; i++) { if(State.sequenceId !== currentSeq) return; ParticleSystem.morphTo(State.customPhrases[i], 1200); await new Promise(r => setTimeout(r, i === State.customPhrases.length - 1 ? 2500 : 1800)); }
            if(State.sequenceId !== currentSeq) return; await ParticleSystem.warpSpeed();
            if(State.sequenceId !== currentSeq) return;
            
            // 开场瞬间并发 4 颗大烟花
            for(let i=0; i<4; i++) { Fireworks.fire(new THREE.Vector3((Math.random()-0.5)*40, 15 + Math.random()*20, (Math.random()-0.5)*20)); }
            await new Promise(r => setTimeout(r, 400));
            // 连珠炮式海量爆发
            for(let i=0; i<15; i++) { 
                Fireworks.fire(new THREE.Vector3((Math.random()-0.5)*50, 10 + Math.random()*25, (Math.random()-0.5)*25)); 
                if(i % 2 === 0) Fireworks.fire(new THREE.Vector3((Math.random()-0.5)*30, 20 + Math.random()*15, (Math.random()-0.5)*10)); 
                await new Promise(r => setTimeout(r, 150 + Math.random() * 200)); 
                if(State.sequenceId !== currentSeq) return; 
            }
            await new Promise(r => setTimeout(r, 3000));
            if(State.sequenceId !== currentSeq) return;
            State.phase = 'D'; DOM.gestureState.style.opacity = '1'; DOM.giftBtn.style.opacity = '1'; DOM.giftBtn.style.pointerEvents = 'auto';
            setMode('scatter');
        };

        const blowOutCandle = () => {
            State.isCandleLit = false;
            new TWEEN.Tween(ParticleSystem.flameMesh.scale).to({x:0, y:0, z:0}, 300).start();
            new TWEEN.Tween(ParticleSystem.flameLight).to({intensity:0}, 300).start();
            if (State.phase === 'PRE_BLOW') { DOM.modeText.innerText = "呼~ 开启惊喜！"; setTimeout(playCountdownSequence, 600); }
            else if (State.phase === 'D') { DOM.modeText.innerText = "呼~ 开启回忆星空！"; setTimeout(() => setMode('scatter'), 600); }
        };

        const resetToInitialState = () => {
            if (State.phase === 'A') return;
            State.sequenceId++; State.phase = 'PRE_BLOW'; State.mode = 'tree'; State.introStartTime = performance.now(); State.blowFrames = 0;
            TWEEN.removeAll(); exitZoom(true);
            Fireworks.systems.forEach(fw => { scene.remove(fw.mesh); fw.mesh.geometry.dispose(); fw.mesh.material.dispose(); }); Fireworks.systems = [];
            camera.fov = 60; camera.updateProjectionMatrix(); camera.position.set(0, 10, 50); controls.target.set(0, 0, 0); controls.autoRotate = true;
            ParticleSystem.textMesh.scale.set(0, 0, 0); ParticleSystem.pointsMesh.material.opacity = 0.9;
            ParticleSystem.photos.forEach(photo => { photo.scale.set(0, 0, 0); photo.material.opacity = 0; if(photo.userData.border) photo.userData.border.material.opacity = 0.6; });
            ParticleSystem.morphTo('tree', 1500); State.isCandleLit = true; ParticleSystem.candleMesh.scale.set(1, 1, 1); ParticleSystem.candleMesh.material.opacity = 1;
            ParticleSystem.flameMesh.scale.set(1, 1, 1); ParticleSystem.flameLight.intensity = 2;
            State.hoverIndex = -1; DOM.gestureState.style.opacity = '1'; DOM.modeText.innerText = "模式: 聚合蛋糕 (等待手势/吹气)"; DOM.giftBtn.style.opacity = '0'; DOM.giftBtn.style.pointerEvents = 'none';
        };

        const setMode = (newMode) => {
            if(State.mode === newMode || State.phase !== 'D') return;
            if(State.mode === 'zoom' && newMode !== 'zoom') { exitZoom(); setTimeout(() => executeModeSwitch(newMode), 500); }
            else executeModeSwitch(newMode);
        };

        const executeModeSwitch = (newMode) => {
            State.mode = newMode;
            if(newMode === 'tree') {
                DOM.modeText.innerText = "模式: 聚合蛋糕"; ParticleSystem.morphTo('tree'); controls.autoRotate = true;
                ParticleSystem.photos.forEach(photo => { new TWEEN.Tween(photo.scale).to({x: 0, y: 0, z: 0}, 1000).easing(TWEEN.Easing.Back.In).start(); new TWEEN.Tween(photo.material).to({opacity: 0}, 1000).start(); });
            } else if(newMode === 'scatter') {
                DOM.modeText.innerText = "模式: 星云散开"; ParticleSystem.morphTo('scatter'); controls.autoRotate = true;
                ParticleSystem.photos.forEach(photo => { new TWEEN.Tween(photo.scale).to({x: 1, y: 1, z: 1}, 1500).easing(TWEEN.Easing.Elastic.Out).start(); new TWEEN.Tween(photo.material).to({opacity: 1}, 1000).start(); });
            }
        };

        const enterZoom = async (index) => {
            State.mode = 'zoom'; DOM.modeText.innerText = "模式: 照片特写"; controls.autoRotate = false;
            new TWEEN.Tween(ParticleSystem.pointsMesh.material).to({opacity: 0.1}, 800).start();
            ParticleSystem.photos.forEach((photo, i) => { if(i !== index) { new TWEEN.Tween(photo.material).to({opacity: 0}, 500).start(); if(photo.userData.border) new TWEEN.Tween(photo.userData.border.material).to({opacity: 0}, 500).start(); } });
            const targetPhoto = ParticleSystem.photos[index], targetPos = new THREE.Vector3(); targetPhoto.getWorldPosition(targetPos);
            const normal = new THREE.Vector3(0, 0, 1); normal.applyQuaternion(targetPhoto.quaternion);
            const camTargetPos = targetPos.clone().add(normal.multiplyScalar(10));
            new TWEEN.Tween(camera.position).to({x: camTargetPos.x, y: camTargetPos.y, z: camTargetPos.z}, 1200).easing(TWEEN.Easing.Cubic.Out).start();
            new TWEEN.Tween(controls.target).to({x: targetPos.x, y: targetPos.y, z: targetPos.z}, 1200).easing(TWEEN.Easing.Cubic.Out).start();
            State.activeZoomToken++; const currentZoomToken = State.activeZoomToken;
            DOM.aiCaptionBox.classList.remove('hidden-box'); DOM.aiCaptionText.innerText = "✨ AI 正在凝视回忆...";
            const base64Data = targetPhoto.userData.base64;
            if(base64Data) { const caption = await GeminiAPI.callVision("描述这张照片，15字内，诗意温馨。", base64Data); if (State.activeZoomToken === currentZoomToken && State.mode === 'zoom') DOM.aiCaptionText.innerText = caption ? `✨ ${caption}` : "✨ 珍贵的美好回忆"; }
        };

        const exitZoom = (force = false) => {
            State.activeZoomToken++; DOM.aiCaptionBox.classList.add('hidden-box'); if (force) return;
            controls.autoRotate = true; new TWEEN.Tween(ParticleSystem.pointsMesh.material).to({opacity: 0.9}, 800).start();
            ParticleSystem.photos.forEach(photo => { new TWEEN.Tween(photo.material).to({opacity: 1}, 800).start(); if(photo.userData.border) new TWEEN.Tween(photo.userData.border.material).to({opacity: 0.6}, 800).start(); });
            new TWEEN.Tween(camera.position).to({x: 0, y: 10, z: 50}, 1200).easing(TWEEN.Easing.Cubic.Out).start();
            new TWEEN.Tween(controls.target).to({x: 0, y: 0, z: 0}, 1200).easing(TWEEN.Easing.Cubic.Out).start();
        };

        DOM.giftBtn.addEventListener('click', (e) => { e.stopPropagation(); DOM.giftModal.classList.remove('hidden'); setTimeout(() => DOM.giftModal.classList.add('show'), 10); });
        const hideGiftModal = () => { DOM.giftModal.classList.remove('show'); setTimeout(() => DOM.giftModal.classList.add('hidden'), 400); };
        DOM.closeGift.addEventListener('click', hideGiftModal);
        DOM.btnSurprise.addEventListener('click', (e) => { e.stopPropagation(); hideGiftModal(); DOM.bigCardTextDisplay.innerText = State.cardTextData; if(State.cardImgData) DOM.bigCardImgPreview.src = State.cardImgData; DOM.bigCardModal.classList.remove('hidden'); setTimeout(() => DOM.bigCardModal.classList.add('show'), 100); });
        
        DOM.closeBigCard.addEventListener('click', (e) => { 
            e.stopPropagation(); 
            DOM.bigCardModal.classList.remove('show'); 
            setTimeout(() => DOM.bigCardModal.classList.add('hidden'), 500); 
            
            // 核心新增：关闭大贺卡后自动引爆一波绚丽的烟花秀
            setTimeout(() => {
                for(let i = 0; i < 6; i++) {
                    setTimeout(() => {
                        Fireworks.fire(new THREE.Vector3((Math.random()-0.5)*60, 10 + Math.random()*30, (Math.random()-0.5)*30));
                    }, i * 350); // 每隔350毫秒连发一颗
                }
            }, 400); // 等待大贺卡渐隐动画进行一半时开始放烟花

            if(State.phase === 'D' && State.mode === 'tree' && State.isCandleLit) blowOutCandle(); 
        });

        const raycaster = new THREE.Raycaster();
        const checkHover = () => {
            if(State.mode !== 'scatter' || State.phase !== 'D') {
                DOM.crosshair.classList.remove('active');
                if (State.hoverIndex !== -1 && ParticleSystem.photos[State.hoverIndex]?.userData.border) { new TWEEN.Tween(ParticleSystem.photos[State.hoverIndex].scale).to({x:1, y:1, z:1}, 300).start(); State.hoverIndex = -1; }
                return;
            }
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(ParticleSystem.photos, false);
            if(intersects.length > 0) {
                const hoveredObj = intersects[0].object; const newHoverIndex = ParticleSystem.photos.indexOf(hoveredObj);
                if(newHoverIndex !== -1 && State.hoverIndex !== newHoverIndex) {
                    if(State.hoverIndex !== -1 && ParticleSystem.photos[State.hoverIndex]?.userData.border) new TWEEN.Tween(ParticleSystem.photos[State.hoverIndex].scale).to({x:1, y:1, z:1}, 300).start();
                    State.hoverIndex = newHoverIndex; new TWEEN.Tween(hoveredObj.scale).to({x:1.15, y:1.15, z:1.15}, 300).easing(TWEEN.Easing.Back.Out).start(); DOM.crosshair.classList.add('active');
                }
            } else if(State.hoverIndex !== -1) { new TWEEN.Tween(ParticleSystem.photos[State.hoverIndex].scale).to({x:1, y:1, z:1}, 300).start(); State.hoverIndex = -1; DOM.crosshair.classList.remove('active'); }
        };

        let lastTapTime = 0;
        window.addEventListener('pointerdown', (e) => {
            if(e.target.closest('#top-controls') || e.target.closest('#loading-screen') || e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea')) return;
            try { if (window.localAudioContext?.state === 'suspended') window.localAudioContext.resume(); } catch(e){}
            const now = performance.now();
            if (now - lastTapTime < 400) {
                if (State.phase === 'PRE_BLOW' && State.isCandleLit) blowOutCandle();
                else if (State.phase === 'D') { if(State.mode === 'tree' && State.isCandleLit) blowOutCandle(); else if(State.mode === 'tree') setMode('scatter'); else setMode('tree'); }
                lastTapTime = 0; return;
            }
            lastTapTime = now;
            if(State.phase !== 'D') return;
            if(State.mode === 'zoom') { setMode('scatter'); return; }
            if(State.mode === 'scatter' && State.hoverIndex !== -1) enterZoom(State.hoverIndex);
        });

        let handLandmarker, lastGestureTime = 0, lastVideoTime = -1;
        const video = document.getElementById('webcam-video'), canvasCtx = document.getElementById('output-canvas').getContext('2d');
        const initSensors = async () => {
            try {
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false } });
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if(AudioContext) {
                    window.localAudioContext = new AudioContext(); window.micAnalyser = window.localAudioContext.createAnalyser(); window.micAnalyser.fftSize = 256;
                    window.localAudioContext.createMediaStreamSource(audioStream).connect(window.micAnalyser); window.micDataArray = new Uint8Array(window.micAnalyser.frequencyBinCount);
                }
            } catch (err) {}
            try {
                const videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = videoStream; video.onloadedmetadata = () => video.play();
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                handLandmarker = await HandLandmarker.createFromOptions(vision, { baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "CPU" }, runningMode: "VIDEO", numHands: 1 });
                
                const onReady = () => {
                    document.getElementById('output-canvas').width = video.videoWidth; document.getElementById('output-canvas').height = video.videoHeight;
                    State.gesturesEnabled = true; unlockUI("视觉引擎就绪！");
                };
                if (video.readyState >= 2) onReady(); else video.addEventListener("loadeddata", onReady);
            } catch (err) { unlockUI("视觉引擎未开启，触屏模式就绪。"); }
        };

        const detectFeatures = (handResults) => {
            if(State.phase !== 'PRE_BLOW' && State.phase !== 'D') return;
            const now = performance.now();
            if(now - lastGestureTime < 800 || !handResults.landmarks?.length) return;
            const hand = handResults.landmarks[0], dist = (p1, p2) => Math.sqrt(Math.pow(p1.x-p2.x,2) + Math.pow(p1.y-p2.y,2));
            const isFolded = (tip, pip) => dist(hand[0], hand[tip]) < dist(hand[0], hand[pip]);
            const isFist = isFolded(8, 6) && isFolded(12, 10) && isFolded(16, 14) && isFolded(20, 18);
            const isOpen = !isFolded(8, 6) && !isFolded(12, 10) && !isFolded(16, 14) && !isFolded(20, 18);
            const isPinch = dist(hand[4], hand[8]) < 0.08 && !isFist;
            if (isPinch) {
                if (State.mode === 'scatter' && State.hoverIndex !== -1) { enterZoom(State.hoverIndex); lastGestureTime = now; }
                else if (State.mode === 'zoom') { setMode('scatter'); lastGestureTime = now; }
            } else if (isOpen) {
                if (State.mode === 'tree' || State.mode === 'zoom') { setMode('scatter'); lastGestureTime = now; }
            } else if (isFist && State.mode === 'scatter') { setMode('tree'); lastGestureTime = now; }
        };

        const drawLandmarks = (handResults) => {
            canvasCtx.save(); canvasCtx.clearRect(0, 0, video.videoWidth, video.videoHeight);
            if (handResults.landmarks) {
                canvasCtx.fillStyle = "#ff69b4";
                for (const landmarks of handResults.landmarks) {
                    for (let i = 0; i < landmarks.length; i++) { canvasCtx.beginPath(); canvasCtx.arc(landmarks[i].x * video.videoWidth, landmarks[i].y * video.videoHeight, 2, 0, 2 * Math.PI); canvasCtx.fill(); }
                }
            }
            canvasCtx.restore();
        };

        document.getElementById('upload-photos-start').addEventListener('change', async (e) => { if (!e.target.files?.length) return; for(let file of e.target.files) { const base64 = await compressImage(file); const dbId = await DB.addPhoto(base64); ParticleSystem.addPhoto(base64, dbId); } const photos = await DB.getPhotos(); DOM.uploadText.innerText = `[ 缓存: ${photos.length} 张 ]`; });
        DOM.btnManagePhotos.addEventListener('click', async () => { await renderPhotoGrid(); DOM.photoManagerModal.classList.remove('hidden'); setTimeout(() => { DOM.photoManagerModal.classList.remove('opacity-0', 'pointer-events-none'); DOM.photoManagerContent.classList.remove('scale-95'); DOM.photoManagerContent.classList.add('scale-100'); }, 10); });
        const renderPhotoGrid = async () => { const photos = await DB.getAllPhotosDetailed(); DOM.photoGrid.innerHTML = ''; photos.forEach(p => { const div = document.createElement('div'); div.className = 'relative group aspect-square rounded-lg overflow-hidden border border-pink-500/30 bg-black/50'; div.innerHTML = `<img src="${p.data}" class="w-full h-full object-cover"><div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition flex items-center justify-center"><button class="bg-red-500 text-white rounded-full p-2 hover:bg-red-600 transition shadow-lg transform hover:scale-110" data-id="${p.id}">🗑️</button></div>`; div.querySelector('button').addEventListener('click', async (e) => { const id = Number(e.currentTarget.getAttribute('data-id')); await DB.deletePhoto(id); const idx = ParticleSystem.photos.findIndex(ph => ph.userData.dbId === id); if (idx !== -1) { scene.remove(ParticleSystem.photos[idx]); ParticleSystem.photos[idx].geometry.dispose(); ParticleSystem.photos[idx].material.dispose(); ParticleSystem.photos.splice(idx, 1); } renderPhotoGrid(); }); DOM.photoGrid.appendChild(div); }); };
        DOM.managerAddPhotos.addEventListener('change', async (e) => { if (!e.target.files?.length) return; for(let file of e.target.files) { const base64 = await compressImage(file); const dbId = await DB.addPhoto(base64); ParticleSystem.addPhoto(base64, dbId); } renderPhotoGrid(); });
        const closePhotoManager = () => { DOM.photoManagerModal.classList.add('opacity-0', 'pointer-events-none'); DOM.photoManagerContent.classList.remove('scale-100'); DOM.photoManagerContent.classList.add('scale-95'); setTimeout(() => DOM.photoManagerModal.classList.add('hidden'), 300); };
        DOM.btnClosePhotoManager.addEventListener('click', closePhotoManager); DOM.photoManagerBg.addEventListener('click', closePhotoManager);
        document.getElementById('upload-card-img').addEventListener('change', async (e) => { if (!e.target.files?.[0]) return; const base64 = await compressImage(e.target.files[0]); await DB.saveSetting('cardImg', base64); State.cardImgData = base64; DOM.cardImgStatus.innerText = "背景已加载 ✅"; DOM.cardImgStatus.classList.add('text-green-400'); });
        let textSaveTimeout; document.getElementById('card-text-input').addEventListener('input', (e) => { State.cardTextData = e.target.value; clearTimeout(textSaveTimeout); textSaveTimeout = setTimeout(() => DB.saveSetting('cardText', State.cardTextData), 500); });
        DOM.btnEditCard.addEventListener('click', () => { DOM.editCardText.value = State.cardTextData; DOM.editCardModal.classList.remove('hidden'); setTimeout(() => { DOM.editCardModal.classList.remove('opacity-0', 'pointer-events-none'); DOM.editCardContent.classList.remove('scale-95'); DOM.editCardContent.classList.add('scale-100'); }, 10); });
        const closeEditModal = () => { DOM.editCardModal.classList.add('opacity-0', 'pointer-events-none'); DOM.editCardContent.classList.remove('scale-100'); DOM.editCardContent.classList.add('scale-95'); setTimeout(() => DOM.editCardModal.classList.add('hidden'), 300); };
        DOM.btnCloseEdit.addEventListener('click', closeEditModal); DOM.editCardBg.addEventListener('click', closeEditModal);
        DOM.editCardImg.addEventListener('change', async (e) => { if (!e.target.files?.[0]) return; const base64 = await compressImage(e.target.files[0]); await DB.saveSetting('cardImg', base64); State.cardImgData = base64; DOM.editCardImgStatus.innerText = "新背景已加载 ✅"; DOM.editCardImgStatus.classList.add('text-green-400'); });
        DOM.btnSaveEdit.addEventListener('click', async () => { State.cardTextData = DOM.editCardText.value; await DB.saveSetting('cardText', State.cardTextData); document.getElementById('card-text-input').value = State.cardTextData; closeEditModal(); DOM.bigCardTextDisplay.innerText = State.cardTextData; if(State.cardImgData) DOM.bigCardImgPreview.src = State.cardImgData; DOM.bigCardModal.classList.remove('hidden'); setTimeout(() => DOM.bigCardModal.classList.add('show'), 100); });
        const handleMusicUpload = (file) => { if(!file) return; const reader = new FileReader(); reader.onload = async (e) => { const base64 = e.target.result; await DB.saveSetting('customAudio', base64); AudioSys.setCustomMusic(base64); }; reader.readAsDataURL(file); };
        document.getElementById('upload-music-start').addEventListener('change', (e) => handleMusicUpload(e.target.files[0]));
        document.getElementById('btn-change-music').addEventListener('change', (e) => handleMusicUpload(e.target.files[0]));
        
        document.getElementById('btn-start').addEventListener('click', async () => { 
            document.getElementById('loading-screen').style.opacity = '0'; 
            try { if (window.localAudioContext?.state === 'suspended') await window.localAudioContext.resume(); } catch(e){}
            try { await Tone.start(); } catch(e) { console.warn('Tone start ignored'); }
            if (AudioSys.customAudio) { AudioSys.customAudio.play().then(() => AudioSys.customAudio.pause()).catch(()=>{}); } 
            setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; runIntroSequence(); }, 1000); 
        });
        
        DOM.btnMusic.addEventListener('click', async () => { await AudioSys.toggle(); DOM.btnMusic.innerText = AudioSys.isPlaying ? "🔊 音乐: 开" : "🔊 音乐: 关"; DOM.btnMusic.classList.toggle('active', AudioSys.isPlaying); });
        DOM.btnReplay.addEventListener('click', resetToInitialState);
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); if(renderer) renderer.setSize(window.innerWidth, window.innerHeight); if(composer) composer.setSize(window.innerWidth, window.innerHeight); });

        const animate = () => { 
            requestAnimationFrame(animate); TWEEN.update(); if(controls) controls.update(); checkHover(); Fireworks.update(); 
            
            if (ParticleSystem.flameMesh && State.isCandleLit && (State.phase === 'PRE_BLOW' || State.phase === 'D')) { 
                const t = performance.now() * 0.01; ParticleSystem.flameMesh.scale.set(1 + Math.sin(t)*0.1, 1 + Math.cos(t)*0.1, 1 + Math.sin(t)*0.1); ParticleSystem.flameLight.intensity = 2 + Math.sin(t*0.5)*0.5; 
                
                if (performance.now() - State.introStartTime > 2000 && window.micAnalyser && window.micDataArray) { 
                    window.micAnalyser.getByteFrequencyData(window.micDataArray); let sum = 0; 
                    for(let i=0; i<30; i++) sum += window.micDataArray[i]; 
                    if (sum / 30 > 65) { 
                        State.blowFrames++; 
                        if (State.blowFrames > 12 && performance.now() - lastGestureTime > 1500) { blowOutCandle(); lastGestureTime = performance.now(); State.blowFrames = 0; } 
                    } else State.blowFrames = 0; 
                } 
            } 
            
            try {
                if(State.gesturesEnabled && handLandmarker && video.readyState >= 2) { 
                    if(video.currentTime !== lastVideoTime) {
                        lastVideoTime = video.currentTime; const handResults = handLandmarker.detectForVideo(video, performance.now()); drawLandmarks(handResults); detectFeatures(handResults); 
                    }
                } 
            } catch (e) { console.warn("Vision Detect Err:", e); }
            
            if(ParticleSystem.textMesh) ParticleSystem.textMesh.lookAt(camera.position); 
            try { if (composer) composer.render(); else renderer.render(scene, camera); } catch(e) { renderer.render(scene, camera); }
        };
        
        (async () => { 
            try { 
                await DB.init(); const photos = await DB.getAllPhotosDetailed(); 
                if(photos.length) { DOM.uploadText.innerText = `[ 缓存: ${photos.length} 张 ]`; photos.forEach(p => ParticleSystem.addPhoto(p.data, p.id)); } 
                const customAudio = await DB.getSetting('customAudio'); if(customAudio) AudioSys.setCustomMusic(customAudio); 
                const savedCardImg = await DB.getSetting('cardImg'); if(savedCardImg) { State.cardImgData = savedCardImg; DOM.cardImgStatus.innerText = "背景已加载 ✅"; DOM.cardImgStatus.classList.add('text-green-400'); } 
                const savedCardText = await DB.getSetting('cardText'); if(savedCardText) { State.cardTextData = savedCardText; document.getElementById('card-text-input').value = savedCardText; } 
            } catch(e) {} 
            ParticleSystem.init(); 
            if(navigator.mediaDevices?.getUserMedia) initSensors(); 
            
            setTimeout(() => {
                if (!document.getElementById('action-container').classList.contains('hidden')) {
                    unlockUI("加载超时或受限，已自动开启基础触屏模式。");
                }
            }, 6000);
            
            animate(); 
        })();
    </script>
</body>
