<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Mother's Day</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cyber-green': '#00ffaa',
                        'cyber-blue': '#00aaff',
                        'cyber-pink': '#ff1493',
                        'cyber-dark': '#010203'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;500;700&family=Zhi+Mang+Xing&display=swap');

        /* 核心背景添加微弱星云辐射感 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at center, #16081c 0%, #010203 100%); font-family: 'Noto Sans SC', sans-serif; color: white; touch-action: none; -webkit-user-select: none; user-select: none; }
        .allow-select { -webkit-user-select: text !important; user-select: text !important; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* 导航栏毛玻璃与高光控制 */
        .glass-nav { background: rgba(20, 10, 30, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255, 105, 180, 0.2); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 105, 180, 0.05); }
        .nav-btn { display: flex; align-items: center; gap: 8px; padding: 6px 12px; color: #d1d5db; font-size: 13px; transition: all 0.3s; border-radius: 999px; letter-spacing: 1px; cursor: pointer; }
        .nav-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
        .nav-btn-highlight { display: flex; align-items: center; gap: 8px; padding: 6px 18px; color: #aaddff; font-size: 13px; transition: all 0.3s; border-radius: 999px; border: 1px solid rgba(0, 170, 255, 0.4); background: rgba(0, 170, 255, 0.05); box-shadow: 0 0 15px rgba(0, 170, 255, 0.15); letter-spacing: 1px; cursor: pointer; }
        .nav-btn-highlight:hover { background: rgba(0, 170, 255, 0.2); box-shadow: 0 0 20px rgba(0, 170, 255, 0.4); color: #fff; }
        
        /* 右侧礼物盲盒卡片质感 */
        .gift-glass-card { background: linear-gradient(180deg, rgba(40, 15, 50, 0.4) 0%, rgba(10, 5, 20, 0.6) 100%); backdrop-filter: blur(12px); border: 1px solid rgba(255, 105, 180, 0.3); border-radius: 16px; box-shadow: 0 10px 40px rgba(255, 105, 180, 0.15), inset 0 2px 15px rgba(255, 255, 255, 0.05); cursor: pointer; pointer-events: auto; }
        .gift-glass-card:hover { transform: scale(1.03) translateY(-50%); box-shadow: 0 15px 50px rgba(255, 105, 180, 0.25), inset 0 2px 20px rgba(255, 255, 255, 0.1); border-color: rgba(255, 105, 180, 0.5); }
        
        /* 左下角手势状态板 */
        .status-panel { background: rgba(10, 5, 20, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; box-shadow: 0 5px 25px rgba(0,0,0,0.5); pointer-events: none; }

        .cyber-button { background: rgba(255, 105, 180, 0.1); border: 1px solid #ff1493; color: #ff69b4; transition: all 0.3s ease; box-shadow: 0 0 10px rgba(255, 105, 180, 0.15); }
        .cyber-button:hover { background: rgba(255, 105, 180, 0.3); box-shadow: 0 0 20px rgba(255, 105, 180, 0.4); color: #fff; }
        
        #loading-screen { position: absolute; z-index: 50; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #010203; transition: opacity 1s ease-out; overflow-y: auto; padding: 20px; }
        .loader-ring { width: 80px; height: 80px; border: 3px solid transparent; border-top-color: #ff69b4; border-bottom-color: #ff1493; border-radius: 50%; animation: spin 1.5s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        #pip-container { width: 120px; height: 90px; position: absolute; bottom: 20px; right: 20px; z-index: 20; border-radius: 8px; border: 2px solid rgba(255, 105, 180, 0.4); overflow: hidden; box-shadow: 0 0 15px rgba(255, 105, 180, 0.2); pointer-events: none; }
        #webcam-video, #output-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; z-index: 10; pointer-events: none; transition: all 0.2s ease; }
        #crosshair.active { border-color: #ff1493; transform: translate(-50%, -50%) scale(1.5); background: rgba(255, 105, 180, 0.2); }
        
        #gift-modal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
        #gift-modal.show { opacity: 1; pointer-events: auto; }
        #gift-modal-bg { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); }
        #gift-modal-content { position: relative; width: 90%; max-width: 380px; background-color: #fff; background-image: url('https://images.unsplash.com/photo-1558244402-286dd748c593?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80'); background-size: cover; background-position: center; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(255, 105, 180, 0.3); transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin: auto; }
        #gift-modal.show #gift-modal-content { transform: scale(1); }
        .card-inner-overlay { background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.95) 100%); padding: 40px 24px; display: flex; flex-direction: column; align-items: center; height: 100%; }
        .calligraphy-text { font-family: 'Zhi Mang Xing', cursive; font-size: 52px; color: #1a1a1a; line-height: 1.1; margin-bottom: 5px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .english-script { font-family: 'Dancing Script', cursive; font-size: 24px; color: #4a4a4a; margin-bottom: 30px; }
        .poem-text { font-family: 'Noto Sans SC', sans-serif; color: #555; font-size: 14px; line-height: 2; text-align: right; width: 100%; padding-right: 10px; margin-bottom: 40px; font-weight: 500; letter-spacing: 2px; }
        
        #big-card-modal { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); }
        #big-card-modal.show { opacity: 1; pointer-events: auto; }
        #big-card-content { position: relative; width: 90%; max-width: 600px; height: 75vh; background: #111; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(255, 105, 180, 0.4); transform: translateY(30px); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #big-card-modal.show #big-card-content { transform: translateY(0); }
        #big-card-img-preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.45; z-index: 0; }
        #big-card-text-display { position: relative; z-index: 10; flex: 1; padding: 40px 30px; font-size: 20px; color: #ffffff; line-height: 2.0; text-align: left; font-family: 'Noto Sans SC', sans-serif; text-shadow: 0 4px 12px rgba(0,0,0,0.9), 0 1px 3px rgba(0,0,0,0.8); overflow-y: auto; display: block; white-space: pre-wrap; word-break: break-word; }
        #close-big-card { position: relative; z-index: 10; margin-top: auto; }
        
        #ai-caption-box { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; z-index: 30; text-align: center; pointer-events: auto; transition: opacity 0.5s ease, transform 0.5s ease; box-shadow: 0 0 20px rgba(255, 105, 180, 0.2); background: rgba(3, 5, 8, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(0, 255, 170, 0.2); border-radius: 12px; }
        #ai-caption-box.hidden-box { opacity: 0; pointer-events: none; transform: translate(-50%, 20px); }
        
        /* 新增：加载页小标题的装饰性点缀 */
        #loading-text::before { content: '— • '; opacity: 0.6; margin-right: 12px; letter-spacing: 0; }
        #loading-text::after { content: ' • —'; opacity: 0.6; margin-left: 12px; letter-spacing: 0; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 105, 180, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 105, 180, 0.8); }
    </style>
</head>
<body>

    <div id="crosshair" class="hidden md:block"></div>
    
    <!-- 顶部左侧 Logo区 -->
    <div id="top-logo" class="absolute top-6 left-8 flex items-center gap-3 z-40 pointer-events-none opacity-0 transition-opacity duration-500">
        <svg class="w-6 h-6 text-pink-400 drop-shadow-[0_0_8px_rgba(255,105,180,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15.546c-.523 0-1.046.151-1.5.454a2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.701 2.701 0 00-1.5-.454M9 6v2m3-2v2m3-2v2M9 3h.01M12 3h.01M15 3h.01M21 21v-7a2 2 0 00-2-2H5a2 2 0 00-2 2v7h18zm-3-9v-2a2 2 0 00-2-2H8a2 2 0 00-2 2v2h12z" />
        </svg>
        <span class="text-xl font-bold tracking-[0.2em] text-transparent bg-clip-text bg-gradient-to-r from-pink-300 to-purple-400 font-[Orbitron]">CAKE VISION</span>
    </div>

    <!-- 删除了左侧主视觉排版，这里直接接底部水印区 -->
    <div id="bottom-watermark" class="absolute bottom-6 left-1/2 -translate-x-1/2 flex flex-col items-center z-20 pointer-events-none opacity-0 transition-opacity duration-1000">
        <div class="flex items-center gap-2 mb-2 opacity-30">
            <span class="w-[3px] h-[3px] rounded-full bg-gray-300"></span><span class="w-[3px] h-[3px] rounded-full bg-gray-300"></span><span class="w-[3px] h-[3px] rounded-full bg-gray-300"></span><span class="w-[3px] h-[3px] rounded-full bg-gray-300"></span><span class="w-[3px] h-[3px] rounded-full bg-gray-300"></span>
        </div>
        <div class="text-[10px] tracking-[0.3em] text-gray-400 font-[Orbitron] mb-1 opacity-60">CAKE VISION</div>
        <div class="text-[8px] tracking-[0.2em] text-gray-500 mb-2 opacity-50">A GIFT MADE WITH LOVE</div>
        <svg class="w-2.5 h-2.5 text-pink-500 fill-current drop-shadow-[0_0_5px_rgba(255,105,180,0.8)]" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>

    <!-- 右侧全息礼物盲盒 -->
    <div id="gift-btn" class="absolute right-10 top-1/2 -translate-y-1/2 z-40 gift-glass-card w-[130px] h-[170px] flex flex-col items-center justify-center transition-all duration-300 opacity-0 pointer-events-none">
        <!-- 盒身发光SVG -->
        <svg class="w-16 h-16 text-pink-300 drop-shadow-[0_0_15px_rgba(255,105,180,0.9)] mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" />
        </svg>
        <div class="text-[13px] font-bold text-gray-100 tracking-[0.1em] mb-0.5 drop-shadow-md">母亲节快乐</div>
        <div class="text-[7px] text-gray-400 tracking-[0.15em] opacity-80 uppercase font-[Orbitron]">Happy Mother's Day</div>
        <div class="mt-4 text-gray-500 animate-bounce opacity-60">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 13l-7 7-7-7m14-8l-7 7-7-7" /></svg>
        </div>
    </div>

    <!-- 顶部全息导航条 -->
    <div id="top-controls" class="absolute top-6 right-8 z-40 flex items-center glass-nav rounded-full px-1.5 py-1.5 opacity-0 transition-opacity duration-500 pointer-events-none">
        <button id="btn-edit-card" class="nav-btn">
            <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg> 编辑贺卡
        </button>
        <div class="w-px h-3.5 bg-white/10 mx-1"></div>
        <button id="btn-manage-photos" class="nav-btn">
            <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg> 照片管理
        </button>
        <div class="w-px h-3.5 bg-white/10 mx-1"></div>
        <label class="nav-btn cursor-pointer" title="上传自定义音乐">
            <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" /></svg> 换音乐
            <input type="file" id="btn-change-music" accept="audio/*" class="hidden">
        </label>
        <div class="w-px h-3.5 bg-white/10 mx-1"></div>
        <button id="btn-music" class="nav-btn">
            <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z" /></svg> <span id="music-btn-text">音乐: 关</span>
        </button>
        <div class="w-px h-3.5 bg-white/10 mx-2"></div>
        <button id="btn-replay" class="nav-btn-highlight">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg> 重新播放
        </button>
    </div>

    <!-- 左下角手势状态板 -->
    <div id="gesture-state" class="absolute bottom-8 left-8 z-30 status-panel px-5 py-3.5 opacity-0 transition-opacity duration-500">
        <div class="flex items-center gap-3 mb-2">
            <div class="w-2 h-2 rounded-full bg-pink-500 shadow-[0_0_8px_#ff1493]"></div>
            <div id="mode-text-span" class="text-[13px] font-bold text-gray-200 tracking-wider drop-shadow-md">等待手势...</div>
        </div>
        <div class="flex items-center gap-2 text-xs text-gray-400 font-medium">
            <svg class="w-3.5 h-3.5 text-gray-400 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" /></svg>
            <span id="hint-text-span">吹风、手势控制或双击屏幕</span>
        </div>
    </div>

    <!-- 弹窗及容器系 -->
    <div id="gift-modal">
        <div id="gift-modal-bg"></div>
        <div id="gift-modal-content">
            <button id="close-gift" class="absolute top-3 right-4 text-gray-500 hover:text-pink-500 text-3xl z-20 font-bold drop-shadow-md">&times;</button>
            <div class="card-inner-overlay">
                <div class="text-center w-full mt-4">
                    <h2 class="calligraphy-text">母亲节快乐</h2>
                    <p class="english-script">- mother's day -</p>
                </div>
                <div class="poem-text mt-8">时光慢些走<br>让我多陪你一会<br>爱你不止今天</div>
                <button id="btn-surprise" class="w-[85%] py-3.5 bg-[#1a1a1a] text-white rounded-full font-bold shadow-lg hover:bg-[#333] transition transform hover:-translate-y-1 tracking-widest mt-auto mb-2 text-sm">开启惊喜 ✨</button>
            </div>
        </div>
    </div>
    <div id="big-card-modal">
        <div id="big-card-content">
            <img id="big-card-img-preview" src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=800&q=80" alt="Card Image">
            <div id="big-card-text-display">亲爱的妈妈，节日快乐！感谢您无私的爱与包容，愿您永远健康美丽。</div>
            <button id="close-big-card" class="w-full py-4 bg-gradient-to-r from-pink-500 to-red-400 text-white font-bold text-lg tracking-widest hover:opacity-90 transition">收下祝福并欣赏烟花 🎇</button>
        </div>
    </div>
    <div id="edit-card-modal" class="fixed inset-0 z-[80] hidden flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" id="edit-card-bg"></div>
        <div class="relative w-[90%] max-w-md bg-[#111] border border-pink-500/50 rounded-2xl p-6 shadow-[0_0_30px_rgba(255,105,180,0.3)] transform scale-95 transition-transform duration-300 flex flex-col" id="edit-card-content">
            <h3 class="text-pink-400 text-lg font-bold mb-4 border-b border-pink-500/30 pb-2">重新编辑大贺卡</h3>
            <label class="w-full block bg-black/60 border border-dashed border-pink-500/50 rounded-lg p-4 text-center cursor-pointer hover:bg-black/80 transition mb-4">
                <span class="text-pink-300 text-sm font-medium" id="edit-card-img-status">点击更换大贺卡背景图</span>
                <input type="file" id="edit-card-img" accept="image/*" class="hidden">
            </label>
            <textarea id="edit-card-text" rows="5" class="allow-select w-full bg-black/60 border border-pink-500/30 rounded-lg px-4 py-3 text-white text-base focus:outline-none focus:border-pink-500 transition resize-none placeholder-gray-500" placeholder="写下你想对她说的话... 支持长按复制粘贴排版"></textarea>
            <div class="flex justify-end gap-3 mt-5">
                <button id="btn-close-edit" class="px-5 py-2 rounded-lg text-sm text-gray-300 hover:text-white transition">取消</button>
                <button id="btn-save-edit" class="px-6 py-2 rounded-lg text-sm font-bold text-white bg-gradient-to-r from-pink-500 to-red-400 hover:opacity-90 transition shadow-[0_0_10px_rgba(255,105,180,0.5)]">保存并预览</button>
            </div>
        </div>
    </div>
    <div id="photo-manager-modal" class="fixed inset-0 z-[80] hidden flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" id="photo-manager-bg"></div>
        <div class="relative w-[90%] max-w-2xl max-h-[85vh] bg-[#111] border border-pink-500/50 rounded-2xl p-6 shadow-[0_0_30px_rgba(255,105,180,0.3)] transform scale-95 transition-transform duration-300 flex flex-col" id="photo-manager-content">
            <div class="flex justify-between items-center mb-4 border-b border-pink-500/30 pb-2">
                <h3 class="text-pink-400 text-lg font-bold">照片相册管理</h3>
                <button id="btn-close-photo-manager" class="text-gray-400 hover:text-white text-3xl font-bold leading-none">&times;</button>
            </div>
            <label class="w-full bg-pink-500/10 border border-dashed border-pink-500/50 rounded-lg p-3 text-center cursor-pointer hover:bg-pink-500/30 transition mb-4 block">
                <span class="text-pink-200 font-bold tracking-widest">➕ 点击上传添加新照片</span>
                <input type="file" id="manager-add-photos" accept="image/*" multiple class="hidden">
            </label>
            <div id="photo-grid" class="flex-1 overflow-y-auto grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 p-1 content-start"></div>
            <p class="text-xs text-gray-500 mt-4 text-center">💡 提示：照片的添加和删除会在关闭此面板后自动刷新并生效。</p>
        </div>
    </div>
    <div id="ai-caption-box" class="px-6 py-4 hidden-box flex items-center justify-center gap-3">
        <p id="ai-caption-text" class="text-white text-sm md:text-base font-bold tracking-wide drop-shadow-md">✨ AI 正在凝视回忆...</p>
    </div>
    
    <!-- 核心替换：一比一复刻的顶级赛博全息加载与设置界面 -->
    <div id="loading-screen" class="relative overflow-hidden bg-[#05020a]">

    <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/", "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm" } }</script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { HandLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';
        import * as TWEEN from 'https://cdnjs.cloudflare.com/ajax/libs/tween.js/21.0.0/tween.esm.js';

        const GeminiAPI = {
            key: "", 
            callVision: async (prompt, base64Image) => {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${GeminiAPI.key}`;
                let parts = [{ text: prompt }];
                if (base64Image) {
                    try {
                        const mimeType = base64Image.match(/data:(.*?);base64/)[1];
                        const data = base64Image.split(',')[1];
                        parts.push({ inlineData: { mimeType, data } });
                    } catch(e) {}
                }
                const payload = { contents: [{ role: "user", parts }] };
                for (let i = 0; i <= 2; i++) {
                    try {
                        const response = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const result = await response.json();
                        return result.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    } catch (error) {
                        if (i === 2) return null;
                        await new Promise(res => setTimeout(res, 1000 * (i+1)));
                    }
                }
            }
        };

        const DB = {
            db: null,
            init: () => new Promise((resolve, reject) => {
                try {
                    if (!window.indexedDB) { resolve(); return; }
                    const req = indexedDB.open("MotherDayDB", 3);
                    req.onupgradeneeded = e => {
                        const db = e.target.result;
                        if(!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
                        if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'id' });
                    };
                    req.onsuccess = e => { DB.db = e.target.result; resolve(); };
                    req.onerror = e => resolve(); 
                } catch(e) { resolve(); }
            }),
            addPhoto: (dataUrl) => new Promise(resolve => {
                if(!DB.db) return resolve(null);
                try {
                    const tx = DB.db.transaction('photos', 'readwrite');
                    const req = tx.objectStore('photos').add({ data: dataUrl });
                    req.onsuccess = e => resolve(e.target.result);
                    req.onerror = e => resolve(null);
                } catch(e) { resolve(null); }
            }),
            getAllPhotosDetailed: () => new Promise(resolve => {
                if(!DB.db) return resolve([]);
                try {
                    const tx = DB.db.transaction('photos', 'readonly');
                    const photos = [];
                    const req = tx.objectStore('photos').openCursor();
                    req.onsuccess = e => {
                        const cursor = e.target.result;
                        if(cursor) { photos.push({ id: cursor.key, data: cursor.value.data }); cursor.continue(); } 
                        else resolve(photos);
                    };
                    req.onerror = () => resolve([]);
                } catch(e) { resolve([]); }
            }),
            getPhotos: () => new Promise(resolve => {
                if(!DB.db) return resolve([]);
                try {
                    const tx = DB.db.transaction('photos', 'readonly');
                    const req = tx.objectStore('photos').getAll();
                    req.onsuccess = e => resolve(e.target.result.map(r => r.data));
                    req.onerror = () => resolve([]);
                } catch(e) { resolve([]); }
            }),
            deletePhoto: (id) => new Promise(resolve => {
                if(!DB.db) return resolve();
                try {
                    const tx = DB.db.transaction('photos', 'readwrite');
                    tx.objectStore('photos').delete(Number(id));
                    tx.oncomplete = resolve;
                } catch(e) { resolve(); }
            }),
            saveSetting: (id, data) => new Promise(resolve => {
                if(!DB.db) return resolve();
                try {
                    const tx = DB.db.transaction('settings', 'readwrite');
                    tx.objectStore('settings').put({ id, data });
                    tx.oncomplete = resolve;
                } catch(e) { resolve(); }
            }),
            getSetting: (id) => new Promise(resolve => {
                if(!DB.db) return resolve(null);
                try {
                    const tx = DB.db.transaction('settings', 'readonly');
                    const req = tx.objectStore('settings').get(id);
                    req.onsuccess = e => resolve(e.target.result ? e.target.result.data : null);
                    req.onerror = () => resolve(null);
                } catch(e) { resolve(null); }
            })
        };

        const compressImage = (file) => new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 1200;
                    let w = img.width, h = img.height;
                    if(w > h && w > MAX_SIZE) { h *= MAX_SIZE/w; w = MAX_SIZE; }
                    else if(h > MAX_SIZE) { w *= MAX_SIZE/h; h = MAX_SIZE; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.9));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        const AudioSys = {
            initialized: false, isPlaying: false, synth: null, customAudio: new Audio(), useCustom: false,
            init: async () => {
                try {
                    await Tone.start();
                    const reverb = new Tone.Reverb(4).toDestination();
                    AudioSys.synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "sine" },
                        envelope: { attack: 1.0, decay: 0.5, sustain: 0.5, release: 3 }
                    }).connect(reverb);
                    AudioSys.synth.volume.value = -12;
                    const chords = [["C4", "E4", "G4"], ["A3", "C4", "E4"], ["F3", "A3", "C4"], ["G3", "B3", "D4"]];
                    let step = 0;
                    Tone.Transport.scheduleRepeat(time => {
                        if(AudioSys.isPlaying) AudioSys.synth.triggerAttackRelease(chords[step % chords.length], "2n", time);
                        step++;
                    }, "1m");
                    AudioSys.customAudio.loop = true;
                    AudioSys.initialized = true;
                } catch(e) { console.warn("AudioSys Init Error:", e); }
            },
            playFireworkSound: () => {
                if(!AudioSys.isPlaying || !AudioSys.initialized) return;
                try {
                    const noise = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.005, decay: 0.8, sustain: 0, release: 0.1 } }).toDestination();
                    noise.volume.value = -16;
                    noise.triggerAttackRelease("4n");
                    const osc = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 0.1 } }).toDestination();
                    osc.volume.value = -24; 
                    osc.triggerAttackRelease("C6", "8n"); osc.frequency.rampTo("C4", 0.5);
                } catch(e) {}
            },
            setCustomMusic: (source) => {
                try {
                    if (source.startsWith('data:audio')) {
                        const arr = source.split(',');
                        const mime = arr[0].match(/:(.*?);/)[1];
                        const bstr = atob(arr[1]);
                        let n = bstr.length;
                        const u8arr = new Uint8Array(n);
                        while(n--) { u8arr[n] = bstr.charCodeAt(n); }
                        const blob = new Blob([u8arr], {type: mime});
                        AudioSys.customAudio.src = URL.createObjectURL(blob);
                    } else {
                        AudioSys.customAudio.src = source;
                    }
                } catch(e) {
                    AudioSys.customAudio.src = source;
                }
                AudioSys.useCustom = true;
                const txtLabel = document.getElementById('music-text');
                if (txtLabel) {
                    txtLabel.innerText = "[ 已固定专属音乐 ✅ ]";
                    txtLabel.classList.add('text-green-400');
                }
            },
            toggle: async () => {
                try {
                    if (!AudioSys.initialized) await AudioSys.init();
                    AudioSys.isPlaying = !AudioSys.isPlaying;
                    if (AudioSys.useCustom) {
                        if (AudioSys.isPlaying) AudioSys.customAudio.play();
                        else AudioSys.customAudio.pause();
                    } else {
                        if (AudioSys.isPlaying) Tone.Transport.start();
                        else Tone.Transport.stop();
                    }
                } catch(e) { console.warn("Audio toggle failed:", e); }
            }
        };

            const loadingText = document.getElementById('loading-text');

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // 渲染器背景透明，允许 body CSS 背景透出
        const wWidth = window.innerWidth || 800;

        const camera = new THREE.PerspectiveCamera(60, wWidth / wHeight, 0.1, 1000);
        camera.position.set(0, 10, 50);
        
        let renderer, composer, controls, bloomPass;
        try {
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(wWidth, wHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.setClearColor(0x000000, 0); 
            container.appendChild(renderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = false;
            controls.autoRotateSpeed = 1.0;
            controls.enablePan = false;
            
            const renderScene = new RenderPass(scene, camera);
            bloomPass = new UnrealBloomPass(new THREE.Vector2(wWidth, wHeight), 1.2, 0.4, 0.98); 
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            
            // 移除了此处的 createNeonRings()，将其迁入粒子系统进行统一状态管理
        } catch (e) {
            console.error("WebGL Init Error:", e);
        }

        const Fireworks = {
            systems: [],
            colors: [0xff1493, 0x00ffaa, 0x00aaff, 0xffff00, 0xff00ff, 0x00ffff, 0xffffff, 0xffa500, 0xff0000, 0x7fff00], 
            fire: (position) => {
                AudioSys.playFireworkSound();
                const geo = new THREE.BufferGeometry();
                const count = 2500;
                const pos = new Float32Array(count * 3);
                const velocities = [];
                const colors = new Float32Array(count * 3);
                const baseColor = new THREE.Color(Fireworks.colors[Math.floor(Math.random() * Fireworks.colors.length)]);
                baseColor.multiplyScalar(2.0);
                for(let i=0; i<count; i++) {
                    pos[i*3] = position.x; pos[i*3+1] = position.y; pos[i*3+2] = position.z;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const speed = 1.5 + Math.random() * 2.5; 
                    velocities.push(new THREE.Vector3( Math.sin(phi)*Math.cos(theta)*speed, Math.sin(phi)*Math.sin(theta)*speed, Math.cos(phi)*speed ));
                    const c = baseColor.clone().lerp(new THREE.Color(0xffffff), Math.random() * 0.3);
                    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                const mat = new THREE.PointsMaterial({ size: 0.15, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 1.0 });
                const fw = new THREE.Points(geo, mat);
                scene.add(fw);
                Fireworks.systems.push({mesh: fw, vels: velocities, life: 5.0, maxLife: 5.0});
            },
            update: () => {
                for(let i = Fireworks.systems.length - 1; i >= 0; i--) {
                    const fw = Fireworks.systems[i];
                    fw.life -= 0.016;
                    if(fw.life <= 0) {
                        scene.remove(fw.mesh); fw.mesh.geometry.dispose(); fw.mesh.material.dispose();
                        Fireworks.systems.splice(i, 1); continue;
                    }
                    const positions = fw.mesh.geometry.attributes.position.array;
                    const lifeRatio = fw.life / fw.maxLife;
                    for(let j=0; j<fw.vels.length; j++) {
                        const v = fw.vels[j];
                        v.x *= 0.988; v.y *= 0.988; v.z *= 0.988;
                        v.y += -0.004;
                        positions[j*3] += v.x; positions[j*3+1] += v.y; positions[j*3+2] += v.z;
                    }
                    fw.mesh.geometry.attributes.position.needsUpdate = true;
                    if (lifeRatio < 0.2) fw.mesh.material.opacity = (Math.random() * 0.8 + 0.2) * (lifeRatio / 0.2);
                    else fw.mesh.material.opacity = 1.0;
                }
            }
        };

        const ParticleSystem = {
            count: 15000, pointsMesh: null, candleMesh: null, flameMesh: null, flameLight: null, textMesh: null, ringGroup: null, photos: [],
            positions: { tree: new Float32Array(15000 * 3), scatter: new Float32Array(15000 * 3), current: new Float32Array(15000 * 3), start: new Float32Array(15000 * 3) },
            morphParams: { progress: 1 }, morphTween: null,
            init: () => {
                const pCanvas = document.createElement('canvas'); pCanvas.width = 32; pCanvas.height = 32;
                const pCtx = pCanvas.getContext('2d');
                const pGrad = pCtx.createRadialGradient(16,16,0, 16,16,16);
                pGrad.addColorStop(0, 'rgba(255,255,255,1)'); pGrad.addColorStop(0.4, 'rgba(255,105,180,0.8)'); pGrad.addColorStop(1, 'rgba(255,105,180,0)');
                pCtx.fillStyle = pGrad; pCtx.fillRect(0,0,32,32);
                const pTex = new THREE.CanvasTexture(pCanvas);

                const geometry = new THREE.BufferGeometry();
                const colors = new Float32Array(ParticleSystem.count * 3);
                const tiers = [ { r: 14, hBase: -8, hThick: 5 }, { r: 10, hBase: -3, hThick: 4 }, { r: 6, hBase: 1, hThick: 3 } ];
                
                for(let i=0; i<ParticleSystem.count; i++) {
                    const rand = Math.random();
                    let tIdx = rand > 0.8 ? 2 : (rand > 0.5 ? 1 : 0);
                    const tier = tiers[tIdx], radius = tier.r * Math.sqrt(Math.random()), theta = Math.random() * 2 * Math.PI, y = tier.hBase + Math.random() * tier.hThick;
                    ParticleSystem.positions.tree[i*3] = radius * Math.cos(theta);
                    ParticleSystem.positions.tree[i*3+1] = y;
                    ParticleSystem.positions.tree[i*3+2] = radius * Math.sin(theta);
                    
                    const sRadius = 40 * Math.cbrt(Math.random()), sTheta = Math.random() * 2 * Math.PI, sPhi = Math.acos(2 * Math.random() - 1);
                    ParticleSystem.positions.scatter[i*3] = sRadius * Math.sin(sPhi) * Math.cos(sTheta);
                    ParticleSystem.positions.scatter[i*3+1] = sRadius * Math.sin(sPhi) * Math.sin(sTheta);
                    ParticleSystem.positions.scatter[i*3+2] = sRadius * Math.cos(sPhi);
                    
                    ParticleSystem.positions.current[i*3] = (Math.random() - 0.5) * 300;
                    ParticleSystem.positions.current[i*3+1] = (Math.random() - 0.5) * 300;
                    ParticleSystem.positions.current[i*3+2] = (Math.random() - 0.5) * 300;
                    
                    const col = new THREE.Color();
                    if (tIdx === 2) { const cR = Math.random(); if(cR < 0.3) col.setHex(0xffffff); else if(cR < 0.6) col.setHex(0xe6e6fa); else col.setHex(0xdda0dd); }
                    else { const cR = Math.random(); if(cR < 0.3) col.setHex(0xffffff); else if(cR < 0.6) col.setHex(0xffb6c1); else col.setHex(0xff69b4); }
                    col.multiplyScalar(1.3);
                    colors[i*3] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b;
                }
                
                geometry.setAttribute('position', new THREE.BufferAttribute(ParticleSystem.positions.current, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                ParticleSystem.pointsMesh = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.4, map: pTex, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
                scene.add(ParticleSystem.pointsMesh);

                ["5", "4", "3", "2", "1"].forEach(txt => ParticleSystem.createTextTarget(txt));
                State.customPhrases.forEach(txt => ParticleSystem.createTextTarget(txt));

                ParticleSystem.candleMesh = new THREE.Mesh( new THREE.CylinderGeometry(0.25, 0.25, 3.5, 16), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending }) );
                ParticleSystem.candleMesh.position.set(0, 5.75, 0); ParticleSystem.candleMesh.scale.set(0,0,0);
                scene.add(ParticleSystem.candleMesh);

                ParticleSystem.flameMesh = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.4, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xff4500).multiplyScalar(2.0), transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending }));
                ParticleSystem.flameMesh.position.set(0, 1.8, 0); ParticleSystem.candleMesh.add(ParticleSystem.flameMesh);

                ParticleSystem.flameLight = new THREE.PointLight(0xffaa00, 0, 25); ParticleSystem.flameLight.position.set(0, 1.8, 0); ParticleSystem.candleMesh.add(ParticleSystem.flameLight);

                const textCanvas2 = document.createElement('canvas'); textCanvas2.width = 1024; textCanvas2.height = 256;
                const textCtx2 = textCanvas2.getContext('2d');
                textCtx2.fillStyle = '#ffffff'; textCtx2.font = 'bold 90px "Orbitron", Arial'; textCtx2.textAlign = 'center'; textCtx2.textBaseline = 'middle';
                textCtx2.fillText("Happy Mother's Day", 512, 100); textCtx2.font = 'bold 30px "Orbitron", Arial'; textCtx2.fillText("BEST WISHES FOR YOU", 512, 160);
                ParticleSystem.textMesh = new THREE.Mesh(new THREE.PlaneGeometry(24, 6), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(textCanvas2), color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
                ParticleSystem.textMesh.position.set(0, 14, 0); ParticleSystem.textMesh.scale.set(0,0,0);
                scene.add(ParticleSystem.textMesh);

                // 核心修改：将 3D 全息底座加入粒子系统，以便与蛋糕同步缩放和隐藏
                ParticleSystem.ringGroup = new THREE.Group();
                ParticleSystem.ringGroup.position.y = -8; 
                ParticleSystem.ringGroup.scale.set(0, 0, 0); // 初始状态隐藏，等动画唤起
                const geo1 = new THREE.RingGeometry(14, 14.5, 64);
                const mat1 = new THREE.MeshBasicMaterial({ color: 0xff1493, transparent: true, opacity: 0.6, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
                const ring1 = new THREE.Mesh(geo1, mat1);
                ring1.rotation.x = -Math.PI / 2;
                ParticleSystem.ringGroup.add(ring1);
                const geo2 = new THREE.RingGeometry(16, 16.1, 64);
                const mat2 = new THREE.MeshBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0.35, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
                const ring2 = new THREE.Mesh(geo2, mat2);
                ring2.rotation.x = -Math.PI / 2;
                ParticleSystem.ringGroup.add(ring2);
                const geo3 = new THREE.RingGeometry(18, 18.05, 64);
                const mat3 = new THREE.MeshBasicMaterial({ color: 0xff1493, transparent: true, opacity: 0.15, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
                const ring3 = new THREE.Mesh(geo3, mat3);
                ring3.rotation.x = -Math.PI / 2;
                ParticleSystem.ringGroup.add(ring3);
                const planeGeo = new THREE.PlaneGeometry(45, 45);
                const planeMat = new THREE.MeshBasicMaterial({ color: 0xff1493, transparent: true, opacity: 0.03, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
                const plane = new THREE.Mesh(planeGeo, planeMat);
                plane.rotation.x = -Math.PI / 2;
                ParticleSystem.ringGroup.add(plane);
                scene.add(ParticleSystem.ringGroup);
            },
            createTextTarget: (txt) => {
                if(!txt) return;
                const tCanvas = document.createElement('canvas'); tCanvas.width = 512; tCanvas.height = 256;
                const tCtx = tCanvas.getContext('2d', {willReadFrequently: true});
                tCtx.fillStyle = 'white'; tCtx.textAlign = 'center'; tCtx.textBaseline = 'middle';
                
                const isSingle = txt.length === 1;
                let fontSize = isSingle ? 220 : (txt.length > 5 ? 60 : (txt.length > 3 ? 80 : 130));
                
                tCtx.font = `bold ${fontSize}px "Noto Sans SC", sans-serif`; tCtx.fillText(txt, 256, 128);
                const imgData = tCtx.getImageData(0,0,512,256).data; const coords = [];
                for(let y=0; y<256; y+=2) {
                    for(let x=0; x<512; x+=2) {
                        if(imgData[(y*512 + x) * 4 + 3] > 128) coords.push({x: (x - 256)*0.15, y: -(y - 128)*0.15, z: 0});
                    }
                }
                const targetArr = new Float32Array(ParticleSystem.count * 3); 
                
                const noiseXY = isSingle ? 1.5 : 0.5;
                const noiseZ = isSingle ? 12.0 : 0.5; 
                
                for(let i=0; i<ParticleSystem.count; i++) {
                    const ref = coords[i % Math.max(1, coords.length)] || {x:0, y:0, z:0};
                    targetArr[i*3] = ref.x + (Math.random()-0.5)*noiseXY;
                    targetArr[i*3+1] = ref.y + (Math.random()-0.5)*noiseXY;
                    targetArr[i*3+2] = ref.z + (Math.random()-0.5)*noiseZ;
                }
                ParticleSystem.positions[txt] = targetArr;
            },
            arrangePhotos: () => {
                const count = ParticleSystem.photos.length;
                if(count === 0) return;
                const phi = Math.PI * (3 - Math.sqrt(5)); 
                ParticleSystem.photos.forEach((mesh, i) => {
                    let y = 1 - (i / (count - 1 || 1)) * 2; 
                    const radius = Math.sqrt(1 - y * y); 
                    const theta = phi * i;
                    const r = 35;
                    const targetPos = new THREE.Vector3(Math.cos(theta) * radius * r, y * r, Math.sin(theta) * radius * r);
                    
                    const dummy = new THREE.Object3D();
                    dummy.position.copy(targetPos);
                    dummy.lookAt(0,0,0);

                    if (State.phase === 'D' && State.mode === 'scatter') {
                        new TWEEN.Tween(mesh.position).to({x: targetPos.x, y: targetPos.y, z: targetPos.z}, 1500).easing(TWEEN.Easing.Cubic.Out).start();
                        new TWEEN.Tween(mesh.quaternion).to({x: dummy.quaternion.x, y: dummy.quaternion.y, z: dummy.quaternion.z, w: dummy.quaternion.w}, 1500).start();
                    } else {
                        mesh.position.copy(targetPos);
                        mesh.quaternion.copy(dummy.quaternion);
                    }
                });
            },
            morphTo: (targetMode, duration = 1800) => {
                return new Promise(resolve => {
                    if(State.isMorphing && ParticleSystem.morphTween) ParticleSystem.morphTween.stop();
                    State.isMorphing = true;
                    const currentPosArray = ParticleSystem.pointsMesh.geometry.attributes.position.array;
                    const targetArray = ParticleSystem.positions[targetMode] || ParticleSystem.positions['tree'];
                    for(let i=0; i<ParticleSystem.count*3; i++) ParticleSystem.positions.start[i] = currentPosArray[i];
                    ParticleSystem.morphParams.progress = 0;
                    ParticleSystem.morphTween = new TWEEN.Tween(ParticleSystem.morphParams).to({ progress: 1 }, duration).easing(TWEEN.Easing.Exponential.InOut).onUpdate(() => {
                        const p = ParticleSystem.morphParams.progress;
                        for(let i=0; i<ParticleSystem.count*3; i++) currentPosArray[i] = ParticleSystem.positions.start[i] + (targetArray[i] - ParticleSystem.positions.start[i]) * p;
                        ParticleSystem.pointsMesh.geometry.attributes.position.needsUpdate = true;
                    }).onComplete(() => { State.isMorphing = false; resolve(); }).start();

                    // 核心修复：重构 3D 配件的显示隐藏逻辑。只要目标不是 'tree' (蛋糕模式)，全息底座、蜡烛和浮空标题一律平滑缩小消失！
                    const targetScale = targetMode === 'tree' ? 1 : 0;
                    
                    new TWEEN.Tween(ParticleSystem.candleMesh.scale).to({x: targetScale, y: targetScale, z: targetScale}, duration * 0.8).easing(TWEEN.Easing.Back.InOut).start();
                    new TWEEN.Tween(ParticleSystem.textMesh.scale).to({x: targetScale, y: targetScale, z: targetScale}, duration * 0.8).easing(TWEEN.Easing.Back.InOut).start();
                    if(ParticleSystem.ringGroup) new TWEEN.Tween(ParticleSystem.ringGroup.scale).to({x: targetScale, y: targetScale, z: targetScale}, duration * 0.8).easing(TWEEN.Easing.Back.InOut).start();
                    
                    new TWEEN.Tween(ParticleSystem.candleMesh.material).to({opacity: targetScale}, duration * 0.8).start();
                    new TWEEN.Tween(ParticleSystem.textMesh.material).to({opacity: targetScale}, duration * 0.8).start();
                    
                    if (targetMode === 'tree') {
                        if (!State.isCandleLit) {
                            State.isCandleLit = true;
                            new TWEEN.Tween(ParticleSystem.flameMesh.scale).to({x:1, y:1, z:1}, 1000).delay(duration * 0.5).easing(TWEEN.Easing.Elastic.Out).start();
                            new TWEEN.Tween(ParticleSystem.flameLight).to({intensity:2}, 1000).delay(duration * 0.5).start();
                        }
                    } else {
                        if (State.isCandleLit) {
                            State.isCandleLit = false;
                            new TWEEN.Tween(ParticleSystem.flameMesh.scale).to({x:0, y:0, z:0}, 500).start();
                            new TWEEN.Tween(ParticleSystem.flameLight).to({intensity:0}, 500).start();
                        }
                    }
                });
            },
            warpSpeed: () => {
                return new Promise(resolve => {
                    State.isMorphing = true;
                    const currentPosArray = ParticleSystem.pointsMesh.geometry.attributes.position.array;
                    const params = { zOffset: 0 }; const startZ = new Float32Array(ParticleSystem.count);
                    for(let i=0; i<ParticleSystem.count; i++) startZ[i] = currentPosArray[i*3+2];
                    new TWEEN.Tween(params).to({ zOffset: 250 }, 1500).easing(TWEEN.Easing.Quadratic.In).onUpdate(() => {
                        for(let i=0; i<ParticleSystem.count; i++) currentPosArray[i*3+2] = startZ[i] + params.zOffset * (1 + Math.random()*0.2);
                        ParticleSystem.pointsMesh.geometry.attributes.position.needsUpdate=true;
                    }).start();
                    new TWEEN.Tween(camera).to({ fov: 140 }, 1500).easing(TWEEN.Easing.Cubic.In).onUpdate(() => camera.updateProjectionMatrix()).onComplete(() => {
                        State.isMorphing = false; camera.fov = 60; camera.updateProjectionMatrix(); resolve();
                    }).start();
                });
            },
            addPhoto: (base64Url, dbId = null) => {
                const texLoader = new THREE.TextureLoader();
                texLoader.load(base64Url, (texture) => {
                    texture.colorSpace = THREE.SRGBColorSpace;
                    const aspect = texture.image.width / texture.image.height;
                    const geo = new THREE.PlaneGeometry(8 * aspect, 8);
                    
                    const mat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true, opacity: 0 });
                    
                    const mesh = new THREE.Mesh(geo, mat);
                    const line = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xff69b4, transparent: true, opacity: 0.6 }));
                    mesh.add(line);
                    mesh.userData = { border: line, base64: base64Url, dbId: dbId };
                    
                    scene.add(mesh);
                    ParticleSystem.photos.push(mesh);
                    
                    ParticleSystem.arrangePhotos(); 

                    if(State.phase === 'D' && State.mode === 'scatter') {
                        mesh.scale.set(0,0,0);
                        new TWEEN.Tween(mesh.scale).to({x: 1, y: 1, z: 1}, 1500).easing(TWEEN.Easing.Elastic.Out).start();
                        new TWEEN.Tween(mat).to({opacity: 1}, 1000).start();
                    } else { mesh.scale.set(0,0,0); }
                });
            }
        };

        const runIntroSequence = async () => {
            State.sequenceId++; State.phase = 'PRE_BLOW'; State.introStartTime = performance.now(); State.blowFrames = 0;
            ParticleSystem.morphTo('tree', 1500); controls.autoRotate = true; State.isCandleLit = true;
            ParticleSystem.candleMesh.scale.set(1, 1, 1); ParticleSystem.candleMesh.material.opacity = 1;
            ParticleSystem.flameMesh.scale.set(1, 1, 1); ParticleSystem.flameLight.intensity = 2;
            
            // 还原UI排版，去除了对左侧排版的指令
            DOM.gestureState.classList.remove('hidden'); DOM.gestureState.style.opacity = '1';
            DOM.modeText.innerText = "模式: 聚合蛋糕";
            DOM.topControls.style.opacity = '1'; DOM.topControls.style.pointerEvents = 'auto';
            DOM.topLogo.style.opacity = '1';
            setTimeout(() => { DOM.bottomWatermark.style.opacity = '1'; }, 600);
            
            if(State.gesturesEnabled) { DOM.pipContainer.classList.remove('hidden'); DOM.pipContainer.style.opacity = '1'; }
        };

        const playCountdownSequence = async () => {
            State.sequenceId++; const currentSeq = State.sequenceId; State.phase = 'TRANSITION'; DOM.gestureState.style.opacity = '0';
            try { if (!AudioSys.isPlaying) { await AudioSys.toggle(); DOM.musicBtnText.innerText = "音乐: 开"; DOM.btnMusic.classList.add('active'); } } catch(e){}
            for(let txt of ["5", "4", "3", "2", "1"]) { if(State.sequenceId !== currentSeq) return; ParticleSystem.morphTo(txt, 800); await new Promise(r => setTimeout(r, 1000)); }
            for(let i=0; i<State.customPhrases.length; i++) { if(State.sequenceId !== currentSeq) return; ParticleSystem.morphTo(State.customPhrases[i], 1200); await new Promise(r => setTimeout(r, i === State.customPhrases.length - 1 ? 2500 : 1800)); }
            if(State.sequenceId !== currentSeq) return; await ParticleSystem.warpSpeed();
            if(State.sequenceId !== currentSeq) return;
            
            for(let i=0; i<4; i++) { Fireworks.fire(new THREE.Vector3((Math.random()-0.5)*40, 15 + Math.random()*20, (Math.random()-0.5)*20)); }
            await new Promise(r => setTimeout(r, 400));
            for(let i=0; i<15; i++) { 
                Fireworks.fire(new THREE.Vector3((Math.random()-0.5)*50, 10 + Math.random()*25, (Math.random()-0.5)*25)); 
                if(i % 2 === 0) Fireworks.fire(new THREE.Vector3((Math.random()-0.5)*30, 20 + Math.random()*15, (Math.random()-0.5)*10)); 
                await new Promise(r => setTimeout(r, 150 + Math.random() * 200)); 
                if(State.sequenceId !== currentSeq) return; 
            }
            await new Promise(r => setTimeout(r, 3000));
            if(State.sequenceId !== currentSeq) return;
            State.phase = 'D'; 
            DOM.gestureState.style.opacity = '1'; 
            DOM.giftBtn.style.opacity = '1'; DOM.giftBtn.style.pointerEvents = 'auto';
            DOM.bottomWatermark.style.opacity = '0'; // 散开时可隐藏文字让位给星空
            setMode('scatter');
        };

        const blowOutCandle = () => {
            State.isCandleLit = false;
            new TWEEN.Tween(ParticleSystem.flameMesh.scale).to({x:0, y:0, z:0}, 300).start();
            new TWEEN.Tween(ParticleSystem.flameLight).to({intensity:0}, 300).start();
            if (State.phase === 'PRE_BLOW') { DOM.modeText.innerText = "开启惊喜！"; setTimeout(playCountdownSequence, 600); }
            else if (State.phase === 'D') { DOM.modeText.innerText = "开启回忆星空！"; setTimeout(() => setMode('scatter'), 600); }
        };

        const resetToInitialState = () => {
            if (State.phase === 'A') return;
            State.sequenceId++; State.phase = 'PRE_BLOW'; State.mode = 'tree'; State.introStartTime = performance.now(); State.blowFrames = 0;
            
            if (AudioSys.isPlaying) {
                AudioSys.isPlaying = false;
                if (AudioSys.useCustom) { AudioSys.customAudio.pause(); AudioSys.customAudio.currentTime = 0; } else { Tone.Transport.stop(); }
                DOM.musicBtnText.innerText = "音乐: 关"; DOM.btnMusic.classList.remove('active');
            }

            TWEEN.removeAll(); exitZoom(true);
            Fireworks.systems.forEach(fw => { scene.remove(fw.mesh); fw.mesh.geometry.dispose(); fw.mesh.material.dispose(); }); Fireworks.systems = [];
            camera.fov = 60; camera.updateProjectionMatrix(); camera.position.set(0, 10, 50); controls.target.set(0, 0, 0); controls.autoRotate = true;

            } catch (e) { console.warn("Vision Detect Err:", e); }
            
            if(ParticleSystem.textMesh) ParticleSystem.textMesh.lookAt(camera.position); 
            try { if (composer) composer.render(); else renderer.render(scene, camera); } catch(e) { renderer.render(scene, camera); }
        };
        
        (async () => { 
            try { 
                await DB.init(); const photos = await DB.getAllPhotosDetailed(); 
                if(photos.length) { DOM.uploadText.innerText = `[ 缓存: ${photos.length} 张 ]`; photos.forEach(p => ParticleSystem.addPhoto(p.data, p.id)); } 
                const customAudio = await DB.getSetting('customAudio'); if(customAudio) AudioSys.setCustomMusic(customAudio); 
                const savedCardImg = await DB.getSetting('cardImg'); if(savedCardImg) { State.cardImgData = savedCardImg; DOM.cardImgStatus.innerText = "背景已加载 ✅"; DOM.cardImgStatus.classList.add('text-green-400'); } 
                const savedCardText = await DB.getSetting('cardText'); if(savedCardText) { State.cardTextData = savedCardText; document.getElementById('card-text-input').value = savedCardText; } 
            } catch(e) {} 
            ParticleSystem.init(); 
            if(navigator.mediaDevices?.getUserMedia) initSensors(); 
            
            // 延长超时判定时间至 8 秒，给与网络环境不佳时充足的加载机会
            setTimeout(() => {
                if (!document.getElementById('action-container').classList.contains('hidden')) {
                    unlockUI("加载超时或环境受限，已自动开启触屏模式。");
                }
            }, 8000);
            
            animate(); 
        })();
    </script>
</body>
</html>
